<!doctype html>
<html lang="en">
  <head>
    <title>Payload Launchpad</title>
    <link rel="stylesheet" href="elfldr.css">
    <script src="input.js"></script>
    <script src="dialog.js"></script>
    <script src="elfldr.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.0.0/css/xterm.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.0.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.6.0/lib/xterm-addon-fit.js"></script>
  </head>

  <body onload="init();">
    <header id="app-header">
      <nav id="category-tabs" role="tablist" aria-label="Categories"></nav>
    </header>

    <div id="catalogue">
      <p id="catalogue-empty" hidden>No payloads in this category yet.</p>
    </div>

    <div id="details" hidden>
      <h1 id="details-name"></h1>
      <p id="details-desc"></p>

      <label>Source code</label>
      <p id="details-src"></p>

      <label>Contributors</label>
      <p id="details-contrib"></p>

      <div id="details-term">
	<label>Standard output</label>
	<div id="details-stdout"></div>
      </div>
    </div>

    <dialog id="pick-dialog">
      <h1 id="pick-title"></h1>
      <div id="pick-list"></div>
    </dialog>

    <div id="toast-list"></div>

    <img id="mixed-content-workaround" hidden />
  </body>
</html>
